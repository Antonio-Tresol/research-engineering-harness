# Executable standards for the harness's own Python.  Run: uvx lanorme check .
#
# NOTE ON FORMAT: in a standalone lanorme.toml the keys are TOP-LEVEL. The
# [tool.lanorme] table form is only for pyproject.toml — using it here parses
# fine and silently applies nothing, which looks like a working config.
#
# The harness holds AI agents to mechanical checks, so it applies the same to
# itself. lanorme owns Python quality and Agent Skills spec compliance
# (SKILL-001..006); the plugins below add the harness's own rules, so one
# command covers everything.

plugins = ["lanorme_plugins.tensors", "lanorme_plugins.skill_portability"]

select = ["ALL"]

ignore = [
    # Parsed YAML/JSON at an I/O boundary is genuinely untyped — dict[str, object]
    # is the honest annotation, not a placeholder for a domain type that does not exist.
    "TYPE-001",
    # The skills' reference implementations import torch lazily on purpose, so the
    # files stay readable, lintable, and runnable on a machine with no GPU.
    "IMPORT-001",
]

exclude = [
    "research/**",     # frozen survey records, not maintained code
    "references/**",
]
